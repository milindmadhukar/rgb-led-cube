; RGB LED Cube firmware: WLED v16 + AudioReactive + cube_ui, for a classic ESP32 DevKit V1.
; This file is copied into the WLED checkout by firmware/build.sh (and by CI); edit it here.
;
; Pin map (see docs/11 - controller board & base wiring.md):
;   slabs S0..S7 -> GPIO 16,17,18,19,23,25,26,27 (one WS2812 bus of 64 LEDs each)
;   button J11   -> GPIO 13      knob wiper -> GPIO 34 (ADC1)
;   OLED I2C     -> SDA 21, SCL 22
;   INMP441      -> SD 32, WS 15, SCK 14

[platformio]
default_envs = cube_esp32

[env:cube_esp32]
extends = env:esp32dev
custom_usermods =
  audioreactive
  cube_ui
; esp32dev's flags minus its WLED_RELEASE_NAME, so ours doesn't trigger a redefinition warning
build_flags =
  ${common.build_flags}
  ${esp32_idf_V4.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D WLED_RELEASE_NAME=\"LEDCube_ESP32\"
; WLED's Update page "Auto update" pulls the latest release of this repo whose asset ends in
; _<tag without v>_LEDCube_ESP32.bin (firmware/package.sh names it that way)
  -D WLED_REPO=\"milindmadhukar/rgb-led-cube\"
  -D SERVERNAME=\"LED-Cube\"
  -D DATA_PINS=16,17,18,19,23,25,26,27
  -D PIXEL_COUNTS=64
  -D ABL_MILLIAMPS_DEFAULT=9000
  -D BTNPIN=13
  -D I2CSDAPIN=21
  -D I2CSCLPIN=22
  -D SR_DMTYPE=1
  -D I2S_SDPIN=32
  -D I2S_WSPIN=15
  -D I2S_CKPIN=14
  -D CUBEUI_POT_PIN=34
